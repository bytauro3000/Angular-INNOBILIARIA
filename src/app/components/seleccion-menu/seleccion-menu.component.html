<div class="selection-wrapper">
  <div class="selection-card">
    <div class="card-header">
      <img
        [src]="empresaData?.logoSmallUrl || empresaData?.logoUrl || 'https://res.cloudinary.com/dlgqaifrk/image/upload/f_auto,q_auto/v1773723460/logo_y1ygeg.png'"
        alt="Logo de la empresa"
        class="brand-logo"
      />
      <h1 class="heading">Selecciona tu módulo de trabajo</h1>
      <p class="subheading" *ngIf="usuarioNombre">Bienvenido, <strong>{{ usuarioNombre }}</strong></p>
    </div>

    <div class="options-grid">
      <button class="option-card option-secretaria" (click)="irASecretaria()">
        <div class="card-icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <path d="M8 21h8"/>
            <path d="M12 17v4"/>
            <path d="M7 7h10"/>
            <path d="M7 11h10"/>
          </svg>
        </div>
        <div class="card-body">
          <span class="card-title">Menú Secretaría</span>
          <span class="card-desc">Clientes, contratos, lotes, pagos, reportes, mensajería y agenda</span>
        </div>
        <div class="card-arrow" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </div>
      </button>

      <button class="option-card option-soporte" (click)="irASoporte()">
        <div class="card-icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <div class="card-body">
          <span class="card-title">Menú Soporte</span>
          <span class="card-desc">Gestión de lotes, programas, parceleros y vendedores</span>
        </div>
        <div class="card-arrow" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </div>
      </button>
    </div>

    <button class="logout-btn" (click)="cerrarSesion()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Cerrar sesión
    </button>
  </div>
</div>
